<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A new website is on its way.">
  <meta name="theme-color" content="#151815">
  <title>Coming soon</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: #151815; color: #f5f0e6; }
    main { width: min(100%, 46rem); padding: clamp(2rem, 7vw, 5rem); border: 1px solid #42483c; border-radius: 1.25rem; background: #1d221c; }
    .accent { width: 3rem; height: .25rem; margin-bottom: 2.5rem; background: #c3cf9b; border-radius: 1rem; }
    h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 5rem); font-weight: 600; line-height: 1.05; letter-spacing: -.055em; overflow-wrap: anywhere; }
    p { max-width: 30ch; margin: 1.5rem 0 0; color: #bfc6b6; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
    footer { margin-top: 3.5rem; color: #bfc6b6; font-size: .85rem; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <div class="accent" aria-hidden="true"></div>
    <h1>Coming soon.</h1>
    <p>A new home on the web.<br>More to come.</p>
    <footer>viteskaposla.github.io</footer>
  </main>
</body>
</html>
